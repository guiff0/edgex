# Upload this in your PowerSync instance dashboard once it's connected to
# Supabase (see the note at the bottom of edgex_schema.sql).
#
# Global bucket: every device syncs all active jobs — small, public dataset.
# User bucket: each signed-in user only syncs applications they submitted.
# Adjust the applications rule if you add a user_id column instead of
# matching on email.

bucket_definitions:
  global:
    data:
      - select * from jobs where active = true

  by_user:
    parameters: select request.user_id() as user_id
    data:
      - select * from applications where email = request.jwt() ->> 'email'
